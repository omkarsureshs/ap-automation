databases:
  - name: ap-automation-db
    plan: free
    databaseName: ap_automation
    user: ap_automation

services:
  - type: web
    name: ap-automation-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ap-automation-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ap-automation-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ap-automation-frontend.onrender.com
      - key: BANKING_GATEWAY
        value: mock
      - key: POSTGRES_DB
        fromDatabase:
          name: ap-automation-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: ap-automation-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ap-automation-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: ap-automation-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: ap-automation-db
          property: port

  - type: web
    name: ap-automation-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://ap-automation-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
