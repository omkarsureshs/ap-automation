server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;   # invoice uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # OCR runs inside the request
    }

    # Uploaded invoice files, read directly from the same named volume the
    # backend writes them to (docker-compose.prod.yml) — Django itself only
    # serves this path when DEBUG=True, so nginx serves it here instead.
    location /media/ {
        alias /usr/share/nginx/html/media/;
        add_header Cache-Control "private, max-age=3600";
        try_files $uri =404;
    }

    # Django admin (for editing ApprovalRule rows etc.) and WhiteNoise's own static
    # files (including the admin's CSS/JS) — without these two blocks both fall
    # through to the SPA's index.html instead of reaching Django.
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Vite output filenames contain a content hash, so they are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (React Router shows the 404 page).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
